services:
  mongodb:
    image: mongo:7.0
    container_name: wellnesshub-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-wellnesshub}
    ports:
      # Exposed so `npm run dev` on the host can reach this database too.
      # Drop this mapping when deploying.
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      # Collections and indexes are created by the Mongoose schemas on boot,
      # and sample data comes from `npm run seed`, so no init script is mounted.
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wellnesshub

  backend:
    build:
      context: ./server
    container_name: wellnesshub-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME:-wellnesshub}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      # The browser talks to nginx, which proxies /api, so the API's own origin
      # is the frontend's.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wellnesshub

  frontend:
    build:
      context: ./client
      args:
        # Same-origin by default: nginx in this image proxies /api to backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: wellnesshub-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      - backend
    networks:
      - wellnesshub

volumes:
  mongodb_data:
    driver: local

networks:
  wellnesshub:
    driver: bridge
