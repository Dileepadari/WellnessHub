upstream api {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # These three are repeated in every location that serves this image's own
    # content, and deliberately not hoisted to the server block.
    #
    # nginx does not merge add_header across levels: a location that declares
    # any add_header of its own discards every one inherited from above. All
    # three locations below set Cache-Control or Content-Type, so a server-level
    # copy of these headers reached none of them, and the app shipped with no
    # clickjacking, sniffing or referrer protection on a single HTML page or
    # script. `always` does not help; it only controls error responses.
    #
    # The proxied locations are left without them on purpose: the API sets its
    # own through helmet, and adding a second X-Frame-Options here produced two
    # conflicting values on one response.

    # nginx's own liveness probe. Named /healthz so it cannot collide with the
    # app's /api/health routes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "healthy\n";
    }

    # The API's liveness endpoint sits at the root, not under /api. Without this
    # location it fell through to the SPA fallback below and answered 200 with
    # index.html, so anything monitoring /health saw a healthy service while the
    # API was stopped. Proxied, it reports what the API reports, and 502 when
    # there is no API to ask.
    location = /health {
        proxy_pass http://api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API is served from the same origin, so the browser never makes a
    # cross-origin request and CORS is not involved in production.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # index.html must never be cached, or clients keep loading a stale bundle
    # after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
